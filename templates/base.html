<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}裏垢トラッカー{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head><body>
<nav>
  <a href="/">📊 ダッシュボード</a>
  <a href="/identity">🔍 特定</a>
  <a href="/runs">🗂 特定履歴</a>
  <a href="/accounts">🆔 アカウント台帳</a>
  <a href="/links">🔗 リンク追跡</a>
  <a href="/targets">🎯 ターゲット</a>
  <a href="/activity">📜 活動ログ</a>
  <a href="/dms">💬 DM</a>
  <a href="/settings">⚙️ 設定</a>
  <a href="/account">🔑 アカウント</a>
  {% if is_admin %}<a href="/admin">🛡 管理</a>{% endif %}
</nav>

{% if impersonating %}
<div class="imp">管理者 <b>{{ real_user }}</b> が <b>{{ me }}</b> として表示中 —
  <a href="/admin/switch?to=&back={{ request.url.path }}">解除</a></div>
{% endif %}
{% if must_change %}
<div class="imp">初期パスワードのままです。<a href="/account">変更してください</a></div>
{% endif %}

<main>{% block content %}{% endblock %}</main>
</body></html>
