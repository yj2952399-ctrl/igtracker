<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封鎖パネル</title>
<style>
html,body{margin:0;background:#0b0e14;color:#e6e9ef;
  font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
body{padding:16px;max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 10px}
.card{background:#121722;border:1px solid #232c3d;border-radius:12px;padding:14px;margin:0 0 12px}
label{display:block;font-size:12px;color:#93a3bb;margin:10px 0 4px}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;
  border:1px solid #2c3a52;background:#0e131c;color:#e6e9ef;font:inherit}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{cursor:pointer;font:inherit;font-size:14px;padding:10px 18px;border-radius:9px;
  border:1px solid #2c3a52;background:#18202e;color:#dfe6f2}
button.on{background:#14351f;border-color:#2f7a48;color:#b9ffd0}
button.warn{background:#3a1a1c;border-color:#8a2f34;color:#ffd3d5}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:#1c2432;border:1px solid #2c3a52;color:#9fb0c8}
.note{font-size:12px;color:#8b93a7;line-height:1.8}
pre{background:#0a0e15;border:1px solid #1e2735;border-radius:9px;padding:9px;font-size:12px}
</style></head><body>
<h1>🔒 封鎖パネル <span class="tag">{{ 'ON' if on else 'OFF' }}</span></h1>
<div class="note">管理者以外の「新規登録」「ログイン」を一時封鎖します。管理者は素通りできます。</div>

<div class="card">
  <div class="row">
    <button id="tg" class="{{ 'on' if on else '' }}">封鎖 {{ 'ON' if on else 'OFF' }}</button>
    <button id="save">保存</button>
    <span class="note">ブロックした回数: <b id="hits">{{ hits }}</b></span>
    <button id="reset">カウンタ0</button>
    <a class="tag" href="/lock" target="_blank">/lock を見る</a>
  </div>
</div>

<div class="card">
  <label>対象</label>
  <div class="row">
    <button id="bs" class="{{ 'on' if st.block_signup else '' }}">新規登録を止める</button>
    <button id="bl" class="{{ 'on' if st.block_login else '' }}">ログインを止める</button>
  </div>

  <label>見出し（相手に出るタイトル）</label>
  <input id="title" type="text" value="{{ st.title }}">

  <label>新規登録のときの文言</label>
  <textarea id="ms">{{ st.msg_signup }}</textarea>

  <label>ログインのときの文言</label>
  <textarea id="ml">{{ st.msg_login }}</textarea>

  <label>補足（小さく出る文・空でOK）</label>
  <textarea id="note">{{ st.note }}</textarea>

  <label>管理者として通す名前（カンマ区切り・部分一致で判定）</label>
  <input id="admins" type="text" value="{{ admins }}">

  <label>自動解除（UTC / 例 2026-11-01T00:00:00+00:00 ・空でOK）</label>
  <input id="until" type="text" value="{{ st.until }}">
</div>

<details class="card"><summary>現在の状態</summary>
  <pre id="raw"></pre>
</details>

<script>
const $ = (s) => document.querySelector(s);
const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };

async function post(body) {
  const r = await fetch("/lock", {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => null);
  if (j && j.state) { $( "#raw" ).textContent = JSON.stringify(j.state, null, 2); }
  return j;
}

function flip(btn) { if (btn) btn.classList.toggle("on"); }

on("#tg", async () => { await post({on: $("#tg").classList.contains("on") ? 0 : 1}); location.reload(); });
on("#bs", () => flip($("#bs")));
on("#bl", () => flip($("#bl")));
on("#save", async () => {
  await post({
    on: $("#tg").classList.contains("on") ? 1 : 0,
    block_signup: $("#bs").classList.contains("on") ? 1 : 0,
    block_login: $("#bl").classList.contains("on") ? 1 : 0,
    title: $("#title").value,
    msg_signup: $("#ms").value,
    msg_login: $("#ml").value,
    note: $("#note").value,
    admins: $("#admins").value,
    until: $("#until").value
  });
  const b = $("#save"); b.textContent = "保存しました"; setTimeout(() => b.textContent = "保存", 1200);
});
on("#reset", async () => { await post({hits_reset: 1}); $("#hits").textContent = "0"; });

fetch("/lock").then(r => r.json()).then(j => { $("#raw").textContent = JSON.stringify(j, null, 2); });
</script>
</body></html>
