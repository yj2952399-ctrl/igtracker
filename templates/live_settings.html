<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>追跡の表示設定</title>
<style>
body{margin:0;background:#0f1115;color:#e6e9ef;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:#8b93a7;font-size:12px;margin:0 0 16px}
.card{background:#171a21;border:1px solid #232734;border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#c7cddb;margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;box-sizing:border-box;
  background:#0f1115;border:1px solid #2b3346;border-radius:8px;color:#e6e9ef;padding:9px 10px;font-size:14px}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:flex-start;gap:9px;margin:12px 0;font-size:13px;color:#c7cddb;line-height:1.6}
.chk input{margin-top:3px;flex:0 0 auto;width:17px;height:17px}
button{padding:11px 24px;border:0;border-radius:999px;background:#4c8dff;color:#fff;font-size:14px;font-weight:600}
button.ghost{background:#2b3346;color:#c7cddb;font-weight:400}
.msg{background:#12301c;color:#7ee08a;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.err{background:#3a1b1b;color:#ff9b9b;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.env{font-size:11px;color:#6b7386;margin-top:4px}
.hint{font-size:11.5px;color:#8b93a7;line-height:1.7;margin:6px 0 0}
a{color:#4c8dff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style></head><body><div class="wrap">
<h1>追跡の表示設定</h1>
<p class="sub">来訪者に見える文言と、許可を求めるタイミングを決めます。 ／
  <a href="/tracks">追跡一覧</a> ・ <a href="/">ホーム</a></p>

{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% if err %}<div class="err">{{ err }}</div>{% endif %}

<form method="post" action="/livetrack">

  <div class="card">
    <strong>許可を求めるタイミング</strong>
    <label class="chk">
      <input type="checkbox" name="gate" value="1" {% if L.gate %}checked{% endif %}>
      <span>開いた直後に「要件＋続ける」を表示し、押してから位置情報・カメラ・マイクの許可を求める<br>
      <span class="hint">OFFにすると今までどおり読み込み直後に許可を要求します（iOSでプロンプトが競合しやすくなります）</span></span>
    </label>
    <label class="chk">
      <input type="checkbox" name="gate_warn" value="1" {% if L.gate_warn %}checked{% endif %}>
      <span>要件の下に「4G/5G回線ではIPの位置が不正確」の注意書きを出す</span>
    </label>
    <label>「続ける」ボタンの文言</label>
    <input type="text" name="go_text" value="{{ L.go_text }}">
    {% if env_over.get('go_text') %}<div class="env">環境変数 LIVE_GO_TEXT が優先されています</div>{% endif %}
  </div>

  <div class="card">
    <strong>案内の出し方</strong>
    <label>モード</label>
    <select name="ui">
      {% for c in ui_choices %}
      <option value="{{ c }}" {% if L.ui == c %}selected{% endif %}>{{ ui_label[c] }}</option>
      {% endfor %}
    </select>
    <label>許可をお願いする文言（要件の下に出ます）</label>
    <input type="text" name="ask_text" value="{{ L.ask_text }}">
    {% if env_over.get('ask_text') %}<div class="env">環境変数 LIVE_ASK_TEXT が優先されています</div>{% endif %}
    <label>拒否されたときの文言</label>
    <textarea name="deny_text">{{ L.deny_text }}</textarea>
    <label>再試行ボタンの文言</label>
    <input type="text" name="retry_text" value="{{ L.retry_text }}">
  </div>

  <div class="card">
    <strong>挙動</strong>
    <div class="row">
      <div>
        <label>未取得のまま待つ秒数（3〜120）</label>
        <input type="number" name="wait_sec" step="1" min="3" max="120" value="{{ L.wait_sec|int }}">
      </div>
      <div>
        <label>測位後に遷移するまでの秒数（0.5〜30）</label>
        <input type="number" name="dest_min" step="0.5" min="0.5" max="30" value="{{ L.dest_min }}">
      </div>
    </div>
    <label class="chk">
      <input type="checkbox" name="dest_redirect" value="1" {% if L.dest_redirect %}checked{% endif %}>
      <span>測位が取れたら飛び先へ移動する</span>
    </label>
    <label class="chk">
      <input type="checkbox" name="deny_redirect" value="1" {% if L.deny_redirect %}checked{% endif %}>
      <span>未取得・拒否のときも飛び先へ移動する</span>
    </label>
    <label class="chk">
      <input type="checkbox" name="promote_page" value="1" {% if L.promote_page %}checked{% endif %}>
      <span>page として作ったリンクを初回にライブ追跡へ昇格する</span>
    </label>
  </div>

  <button type="submit">保存する</button>
  <button class="ghost" type="submit" formaction="/livetrack/reset"
          onclick="return confirm('既定に戻しますか？')">既定に戻す</button>
</form>
</div></body></html>
