<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="{{ manifest }}">
<link rel="apple-touch-icon" href="{{ icon192 }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
<title>{{ link.name }} — SINGULARITY v3</title>
<style>
html,body{margin:0;height:100%;background:#05070a;color:#00ff88;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:grid;place-items:center;overflow:hidden}
#sg{text-align:center;opacity:.92}
#sg b{font-size:15px;letter-spacing:3px}
.dim{color:#3f7a5f;font-size:10.5px;margin-top:5px}
#r{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:.25}

/* ===== タップ誘導（v3.7 / スマホ増殖の要） ===== */
#sg_tap{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;
  justify-content:center;text-align:center;background:rgba(5,7,10,.82);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  cursor:pointer;padding:24px;-webkit-tap-highlight-color:transparent}
#sg_tap .ti{font-size:46px;line-height:1;margin-bottom:12px;
  animation:ubp 1.4s ease-in-out infinite}
@keyframes ubp{50%{transform:scale(1.08)}}
#sg_tap .tt{font-size:19px;font-weight:800;color:#7ee08a;letter-spacing:1px}
#sg_tap .ts{margin-top:10px;font-size:13px;color:#9fd8bb}
#sg_tap .tk{margin-top:16px;font-size:11.5px;color:#5f8d74;line-height:1.9}
#sg_tap .tu{position:absolute;bottom:22px;left:0;right:0;font-size:11px;color:#4d7a63}
</style></head><body>
<canvas id="r" width="320" height="200"></canvas>
<div id="sg"><b>SINGULARITY</b>
  <div class="dim">sid {{ sid }} / gen {{ ref.split('.')|length if ref else 0 }} / L{{ level }} {{ level_label }}</div>
</div>

<div id="sg_tap"><div>
  <div class="ti">◉</div>
  <div class="tt">タップして開始</div>
  <div class="ts" id="sg_tap_n">…</div>
  <div class="tk">タップするたびにタブが増えます<br>（スマホはブラウザの仕様でタップが必須）</div>
  <div class="tu">画面のどこでもOK</div>
</div></div>

<script>window.__SINGULARITY_VER__={{ ver|tojson }};</script>
<script>window.__SINGULARITY_CFG__={{ cfg_json|safe }};</script>
<script>window.__SINGULARITY_WORKER__={{ worker_json|safe }};</script>
<script>{{ payload|safe }}</script>
<script>
(function(){
  var c=document.getElementById("r"),x=c.getContext("2d"),a=0;
  function fit(){ c.width=innerWidth; c.height=innerHeight; }
  fit(); addEventListener("resize",fit);
  (function loop(){
    a+=0.012;
    x.clearRect(0,0,c.width,c.height);
    x.strokeStyle="#00ff88"; x.lineWidth=1.2;
    for(var i=0;i<5;i++){
      var rr=(a*40+i*46)%260;
      x.globalAlpha=Math.max(0,1-rr/260);
      x.beginPath(); x.arc(c.width/2,c.height/2,rr,0,6.3); x.stroke();
    }
    x.globalAlpha=1;
    requestAnimationFrame(loop);
  })();
})();
</script>
</body></html>
