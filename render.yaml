services:
  - type: web
    name: igtracker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: RUN_SCHEDULER
        value: "1"
      # 以下は任意。全部Webの設定画面で入れられるので、空でもOK。
      # 値を持たせたくない場合は sync: false のままにする。
      - key: IG_USER
        sync: false
      - key: IG_PASS
        sync: false
      - key: IG_SESSION_B64
        sync: false
      - key: WEB_USER
        sync: false
      - key: WEB_PASS
        sync: false