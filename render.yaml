services:
  - type: web
    name: igtracker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: IG_USER
        sync: false
      - key: IG_PASS
        sync: false
      - key: WEB_USER
        value: admin
      - key: WEB_PASS
        sync: false
      - key: IG_SESSION_B64
        sync: false
      - key: RUN_SCHEDULER
        value: "1"